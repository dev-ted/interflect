<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>slide 07</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3f0e8; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1920px; height: 1080px; padding: 72px 112px 80px; display: flex; flex-direction: column; }
.kicker { font-size: 22px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: #737373; }
h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 650; margin: 18px 0 0; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 72px; }
.card { background: #fff; border: 1px solid #e4e0d6; border-radius: 28px; padding: 48px 44px 40px; box-shadow: 0 18px 50px rgba(23,23,23,0.06); }
.label { font-size: 22px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #737373; margin: 0 0 18px; }
.accent { color: #0f766e; }
.bad { color: #b91c1c; }
.note { font-size: 30px; line-height: 1.4; color: #404040; margin: 0; }
pre { margin: 0; background: #171717; color: #f5f5f4; border-radius: 24px; padding: 44px 52px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; line-height: 1.55; }
pre .tag { color: #5eead4; } pre .val { color: #fcd34d; } pre .dim { color: #a3a3a3; } pre .hl { background: rgba(94,234,212,0.18); border-radius: 6px; padding: 0 6px; margin: 0 -6px; }
.callout { position: absolute; font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; background: #b91c1c; border-radius: 10px; padding: 8px 12px; }
.callout.ok { background: #0f766e; }
.takes { width: 1300px; }
.takes p { margin: 0; padding: 30px 0; border-bottom: 1px solid #e4e0d6; font-size: 52px; letter-spacing: -0.035em; font-weight: 600; }
.takes p span { color: #0f766e; margin-right: 18px; }
.takes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #e8e3d6; border-radius: 10px; padding: 2px 12px; }


.lbl2 { font-size: 22px; font-weight: 650; color: #737373; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
.vp { background: #fff; border: 1px solid #e4e0d6; border-radius: 20px; padding: 32px; box-shadow: 0 18px 50px rgba(23,23,23,.06); }

</style>
<body>
<div class="frame">
  <div class="kicker">Typography · Lesson 1</div>
  <h1>Fluid size for display text only</h1>
  <div class="stage">
<div style="display:flex;flex-direction:column;gap:36px">
<pre style="width:1000px;font-size:30px"><span class="tag">h1</span> {
  <span class="hl">font-size: clamp(2rem, 1.5rem + 2vw, 3rem);</span>
}</pre>
<div style="display:flex;gap:40px;align-items:flex-end"><div><div class="lbl2">Narrow</div><div class="vp" style="width:400px"><div style="font-size:36px;font-weight:700;letter-spacing:-0.035em;line-height:1.05">Design that holds up</div>
<p style="font-size:24px;margin:18px 0 0;color:#404040">Body text stays at 1rem at every width.</p></div></div><div><div class="lbl2">Wide</div><div class="vp" style="width:900px"><div style="font-size:64px;font-weight:700;letter-spacing:-0.035em;line-height:1.05">Design that holds up</div>
<p style="font-size:24px;margin:18px 0 0;color:#404040">Body text stays at 1rem at every width.</p></div></div></div></div>
</div>
</div>
</body>
</html>
