<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>slide 05</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3f0e8; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1920px; height: 1080px; padding: 72px 112px 80px; display: flex; flex-direction: column; }
.kicker { font-size: 22px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: #737373; }
h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 650; margin: 18px 0 0; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 72px; }
.card { background: #fff; border: 1px solid #e4e0d6; border-radius: 28px; padding: 48px 44px 40px; box-shadow: 0 18px 50px rgba(23,23,23,0.06); }
.label { font-size: 22px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #737373; margin: 0 0 18px; }
.accent { color: #0f766e; }
.bad { color: #b91c1c; }
.note { font-size: 30px; line-height: 1.4; color: #404040; margin: 0; }
pre { margin: 0; background: #171717; color: #f5f5f4; border-radius: 24px; padding: 44px 52px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; line-height: 1.55; }
pre .tag { color: #5eead4; } pre .val { color: #fcd34d; } pre .dim { color: #a3a3a3; } pre .hl { background: rgba(94,234,212,0.18); border-radius: 6px; padding: 0 6px; margin: 0 -6px; }
.callout { position: absolute; font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; background: #b91c1c; border-radius: 10px; padding: 8px 12px; }
.callout.ok { background: #0f766e; }
.takes { width: 1300px; }
.takes p { margin: 0; padding: 30px 0; border-bottom: 1px solid #e4e0d6; font-size: 52px; letter-spacing: -0.035em; font-weight: 600; }
.takes p span { color: #0f766e; margin-right: 18px; }
.takes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #e8e3d6; border-radius: 10px; padding: 2px 12px; }


.lbl2 { font-size: 22px; font-weight: 650; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; }
.chip { width: 300px; height: 300px; border-radius: 28px; border: 1px solid #d4cfc3; display: flex; align-items: flex-end; padding: 24px; font: 600 30px ui-monospace, Menlo, monospace; }

</style>

<div class="frame">
  <div class="kicker">Design systems · Lesson 1</div>
  <h1>One source of truth</h1>
  <div class="stage">
<svg width="1400" height="560" viewBox="0 0 1400 560">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker></defs>
  <rect x="80" y="200" width="320" height="160" rx="24" fill="#171717"/><text x="240" y="275" text-anchor="middle" font-size="40" font-weight="700" fill="#5eead4" style="font-family:ui-monospace,Menlo,monospace">tokens.json</text><text x="240" y="320" text-anchor="middle" font-size="22" fill="#a3a3a3" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif">one file</text>
  <g style="font-family:-apple-system,BlinkMacSystemFont,sans-serif" font-size="30" font-weight="650" fill="#171717">
    <rect x="900" y="40" width="420" height="110" rx="20" fill="#fff" stroke="#e4e0d6"/><text x="1110" y="105" text-anchor="middle">CSS custom properties</text>
    <rect x="900" y="225" width="420" height="110" rx="20" fill="#fff" stroke="#e4e0d6"/><text x="1110" y="290" text-anchor="middle">Tailwind config</text>
    <rect x="900" y="410" width="420" height="110" rx="20" fill="#fff" stroke="#e4e0d6"/><text x="1110" y="475" text-anchor="middle">Design-tool variables</text>
  </g>
  <g stroke="#0f766e" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M400 250 C 650 250, 650 95, 890 95"/><path d="M400 280 L890 280"/><path d="M400 310 C 650 310, 650 465, 890 465"/></g>
</svg>
<p style="position:absolute;left:112px;right:112px;bottom:72px;text-align:center;font-size:32px;margin:0;color:#404040">One web app? CSS custom properties in one file are enough.</p>
