<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>slide 02</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3f0e8; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1920px; height: 1080px; padding: 72px 112px 80px; display: flex; flex-direction: column; }
.kicker { font-size: 22px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: #737373; }
h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 650; margin: 18px 0 0; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 72px; }
.card { background: #fff; border: 1px solid #e4e0d6; border-radius: 28px; padding: 48px 44px 40px; box-shadow: 0 18px 50px rgba(23,23,23,0.06); }
.label { font-size: 22px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #737373; margin: 0 0 18px; }
.accent { color: #0f766e; }
.bad { color: #b91c1c; }
.note { font-size: 30px; line-height: 1.4; color: #404040; margin: 0; }
pre { margin: 0; background: #171717; color: #f5f5f4; border-radius: 24px; padding: 44px 52px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; line-height: 1.55; }
pre .tag { color: #5eead4; } pre .val { color: #fcd34d; } pre .dim { color: #a3a3a3; } pre .hl { background: rgba(94,234,212,0.18); border-radius: 6px; padding: 0 6px; margin: 0 -6px; }
.callout { position: absolute; font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; background: #b91c1c; border-radius: 10px; padding: 8px 12px; }
.callout.ok { background: #0f766e; }
.takes { width: 1300px; }
.takes p { margin: 0; padding: 30px 0; border-bottom: 1px solid #e4e0d6; font-size: 52px; letter-spacing: -0.035em; font-weight: 600; }
.takes p span { color: #0f766e; margin-right: 18px; }
.takes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #e8e3d6; border-radius: 10px; padding: 2px 12px; }


.dash { position: relative; width: 720px; height: 540px; background: #fff; border: 1px solid #e4e0d6; border-radius: 24px; box-shadow: 0 18px 50px rgba(23,23,23,.06); }
.dash .b { position: absolute; background: #ebe7dc; border-radius: 10px; }
.dash .h { background: #171717; height: 26px; border-radius: 6px; }
.dash .f { height: 44px; background: #f3f0e8; border: 1px solid #e4e0d6; }
.dash .c { height: 130px; }
.dash .t { height: 200px; background: repeating-linear-gradient(#ebe7dc 0 30px, #fff 30px 40px); }
.guide { position: absolute; top: -24px; bottom: -24px; width: 0; border-left: 3px solid #b91c1c; opacity: .85; }
.guide.ok { border-color: #0f766e; }
.count { font-size: 120px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; }
.cap { font-size: 28px; color: #404040; margin-top: 12px; }
.dash { zoom: .82; } .stage { gap: 96px; }
</style>
<body>
<div class="frame">
  <div class="kicker">Grids · Lesson 3</div>
  <h1>Count the left edges</h1>
  <div class="stage">
<div style="text-align:center"><div class="dash"><div class="b h" style="left:44px;top:40px;width:300px"></div><div class="b f" style="left:72px;top:96px;width:616px"></div><div class="b c" style="left:28px;top:170px;width:196px"></div><div class="b c" style="left:268px;top:170px;width:196px"></div><div class="b c" style="left:500px;top:170px;width:188px"></div><div class="b t" style="left:56px;top:322px;width:632px"></div><div class="guide" style="left:28px"></div><div class="guide" style="left:44px"></div><div class="guide" style="left:56px"></div><div class="guide" style="left:72px"></div><div class="guide" style="left:268px"></div><div class="guide" style="left:492px"></div><div class="guide" style="left:500px"></div></div><div class="count bad" style="margin-top:28px">7</div><div class="cap">placed by eye</div></div>
<div style="text-align:center"><div class="dash"><div class="b h" style="left:32px;top:40px;width:300px"></div><div class="b f" style="left:32px;top:96px;width:656px"></div><div class="b c" style="left:32px;top:170px;width:196px"></div><div class="b c" style="left:260px;top:170px;width:196px"></div><div class="b c" style="left:488px;top:170px;width:196px"></div><div class="b t" style="left:32px;top:322px;width:656px"></div><div class="guide ok" style="left:32px"></div><div class="guide ok" style="left:488px"></div></div><div class="count accent" style="margin-top:28px">2</div><div class="cap">shared edges, calmer screen</div></div>
</div>
</div>
</body>
</html>
