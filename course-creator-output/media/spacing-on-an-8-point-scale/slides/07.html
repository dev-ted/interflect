<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>slide 07</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f3f0e8; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1920px; height: 1080px; padding: 72px 112px 80px; display: flex; flex-direction: column; }
.kicker { font-size: 22px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: #737373; }
h1 { font-size: 64px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 650; margin: 18px 0 0; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 72px; }
.card { background: #fff; border: 1px solid #e4e0d6; border-radius: 28px; padding: 48px 44px 40px; box-shadow: 0 18px 50px rgba(23,23,23,0.06); }
.label { font-size: 22px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #737373; margin: 0 0 18px; }
.accent { color: #0f766e; }
.bad { color: #b91c1c; }
.note { font-size: 30px; line-height: 1.4; color: #404040; margin: 0; }
pre { margin: 0; background: #171717; color: #f5f5f4; border-radius: 24px; padding: 44px 52px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; line-height: 1.55; }
pre .tag { color: #5eead4; } pre .val { color: #fcd34d; } pre .dim { color: #a3a3a3; } pre .hl { background: rgba(94,234,212,0.18); border-radius: 6px; padding: 0 6px; margin: 0 -6px; }
.callout { position: absolute; font: 600 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #fff; background: #b91c1c; border-radius: 10px; padding: 8px 12px; }
.callout.ok { background: #0f766e; }
.takes { width: 1300px; }
.takes p { margin: 0; padding: 30px 0; border-bottom: 1px solid #e4e0d6; font-size: 52px; letter-spacing: -0.035em; font-weight: 600; }
.takes p span { color: #0f766e; margin-right: 18px; }
.takes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #e8e3d6; border-radius: 10px; padding: 2px 12px; }


.red { margin-right: 140px; width: 720px; background: #fff; border: 1px solid #e4e0d6; border-radius: 28px; padding: 32px 40px; box-shadow: 0 18px 50px rgba(23,23,23,0.06); }
.rr h3 { margin: 0; font-size: 32px; letter-spacing: -0.02em; line-height: 1.1; } .rr p { margin: 0; font-size: 26px; color: #737373; line-height: 1.2; }
.band { position: relative; background: repeating-linear-gradient(135deg, rgba(236,72,153,.16) 0 6px, rgba(236,72,153,.32) 6px 9px); }
.band span { position: absolute; right: -110px; top: 50%; transform: translateY(-50%); font: 700 26px ui-monospace, Menlo, monospace; color: #db2777; }
.band span::before { content: ""; position: absolute; right: calc(100% + 10px); top: 50%; width: 22px; border-top: 2px solid #f9a8d4; }
.band.stray { background: repeating-linear-gradient(135deg, rgba(185,28,28,.18) 0 6px, rgba(185,28,28,.4) 6px 9px); }
.band.stray span { color: #b91c1c; border: 4px solid #b91c1c; border-radius: 50%; width: 76px; height: 76px; display: grid; place-items: center; right: -128px; }

</style>
<body>
<div class="frame">
  <div class="kicker">Spacing · Lesson 2</div>
  <h1>Annotate gaps with scale values</h1>
  <div class="stage">
<div class="red">
  <div class="rr"><h3>Email notifications</h3><div class="band" style="height:16px"><span>8</span></div><p>Weekly summary of your progress.</p></div>
  <div class="band" style="height:48px"><span>24</span></div>
  <div class="rr"><h3>Reminders</h3><div class="band" style="height:16px"><span>8</span></div><p>Nudge me when a streak is at risk.</p></div>
  <div class="band stray" style="height:44px"><span>22</span></div>
  <div class="rr"><h3>Language</h3><div class="band" style="height:16px"><span>8</span></div><p>English (South Africa)</p></div>
</div>
<div style="width:600px"><p class="note" style="font-size:34px">Off the scale?</p><p class="note" style="margin-top:18px;font-size:44px;font-weight:650;color:#171717;letter-spacing:-0.03em;line-height:1.15">Either a bug, or the scale needs a new step.</p><p class="note" style="margin-top:22px">Both are worth a conversation.</p></div>
</div>
</div>
</body>
</html>
